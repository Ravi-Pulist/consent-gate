# Framework Tests — Run the rmad test suite on push/PR
# Validates hooks, access matrix, CLI commands, and RMAD's own guards.
#
# FR-19 asked for a drift guard on every commit. This workflow previously ran `npm test`
# and `npm run test:integration` and nothing else — so the framework recommended `index
# verify` and `task done` to its users in the runbook while running neither itself.
# The guard steps below close that.

name: Framework Tests

on:
  push:
    paths:
      # `templates/` is included deliberately: templates-parity.test.js exists to catch
      # drift between the source tree and the shipped templates, and it could not fire on
      # a commit that touched only templates/.
      - '.claude/**'
      - 'bin/**'
      - 'tests/**'
      - 'templates/**'
      - 'domain-packs/**'
      - 'package.json'
  pull_request:
    paths:
      - '.claude/**'
      - 'bin/**'
      - 'tests/**'
      - 'templates/**'
      - 'domain-packs/**'
      - 'package.json'

jobs:
  test:
    name: Run rmad tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Floor is 22: the code graph stores itself in SQLite via the built-in
        # `node:sqlite`, which is what keeps the graph store at zero npm dependencies.
        # 18 and 20 ship no such module and would fail at require time.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

  guards:
    name: RMAD's own guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # doctor EXECUTES the hooks against probe payloads and asserts their exit codes, in
      # both directions — a denied write must exit 2 AND a permitted one must exit 0. It is
      # the only check that can tell a real guard from a deleted one.
      - name: doctor — prove the hooks still block, and still allow
        run: node bin/rmad.js doctor

      - name: Build the index
        run: node bin/rmad.js index build --force

      # FR-19. Exits 1 when the stored index disagrees with a fresh extract. O2, O3 and O4
      # all read this graph, so a stale index makes the completion predicate confidently
      # wrong rather than merely out of date.
      - name: index verify — fail on graph drift
        run: node bin/rmad.js index verify

      # Reported, not gated. The resolution rate legitimately moves when code is added, so
      # failing on it would fail on ordinary work. Printing it keeps the number visible in
      # the log where a silent slide would otherwise hide.
      - name: index census — publish call-resolution with its denominators
        run: node bin/rmad.js index census

      - name: index audit — corpus signals and selected retrieval tier
        run: node bin/rmad.js index audit

      # Determinism is a published property (N9), so it is checked rather than asserted.
      - name: variance — the predicate must return one distinct result
        run: node bin/rmad.js variance --runs 5

      # NOT gated on the retrieval score. A recall figure is only comparable at the same
      # corpus digest, and every commit changes the corpus this eval indexes — so gating
      # here would fail on ordinary development. See eval.js's corpusFingerprint comment.
      - name: eval — retrieval quality, reported with intervals
        run: node bin/rmad.js eval
